<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<!-- Baseline CSP. This app renders via onclick="" attributes and inline
     style="" throughout, so script-src/style-src need 'unsafe-inline' -
     this restricts which origins can load scripts/styles/connect/frame,
     not inline-script injection. Closing that gap needs moving off
     inline event handlers, a separate larger change. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; manifest-src 'self' blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src https://trinity-vaults.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self';">
<script>
  // Apply saved theme immediately, before first paint, so there's no light-flash in dark mode.
  (function(){
    try{
      var t = localStorage.getItem('trinityVaultsTheme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    }catch(e){}
  })();
</script>
<title>Trinity Vaults</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trinity Vaults">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a2bea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">

  <header class="app-header">
    <div class="header-top">
      <img class="header-logo-img" id="header-logo-img" alt="Trinity">
      <div class="wordmark"><span class="wordmark-sub">Vaults</span></div>
    </div>
    <div class="tagline">D3 &mdash; DATA-DRIVEN DRIVERS</div>
  </header>

  <main id="view"></main>

  <nav class="bottom-nav">
    <button class="nav-btn" id="nav-operational" onclick="openOperationalHome()" title="Operational Vault"></button>
    <button class="nav-btn" id="nav-trinity" onclick="goHome()" title="Trinity Vault"></button>
    <button class="nav-btn center" onclick="goSwitcher()" title="Vault Switcher">
      <img class="nav-logo-img" id="nav-logo-img" alt="Trinity">
    </button>
    <button class="nav-btn" id="nav-importexport" onclick="goImportExportHub()" title="Import / Export"></button>
    <button class="nav-btn" id="nav-settings" onclick="goSettings()" title="Settings"></button>
  </nav>

</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this) closeModal()"></div>

<!-- Firebase (only used if FIREBASE_CONFIG below is filled in — see Settings > Cloud sync) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script src="app.js"></script>
</body>
</html>
